<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FlowSend</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/flowsend-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/flowsend-icon.svg"><meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>
:root{--yellow:#ffc928;--ink:#171817;--bg:#f7f7f3;--card:#fff;--line:#e4e6df;--muted:#70756f;--good:#15835a;--bad:#c95340}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;grid-template-columns:45% 55%;background:#fafaf7}.authleft{display:grid;place-items:center;padding:30px}.authbox{width:min(390px,94vw)}.authright{background:var(--yellow);padding:12%;display:flex;align-items:end}.brand{font-weight:800;font-size:24px}.brand i{font-style:normal;background:var(--yellow);padding:5px 9px;border-radius:7px;margin-right:6px}.auth h1{font-size:38px;margin:20px 0 8px}.muted{color:var(--muted);line-height:1.5}.field{margin-top:14px}.field label{display:block;font-weight:bold;font-size:12px;margin-bottom:6px}input,select{width:100%;border:1px solid #dce0d9;border-radius:7px;padding:12px;background:#fff}.primary{width:100%;padding:13px;border:0;background:var(--yellow);border-radius:7px;font-weight:bold;margin-top:20px}.link{border:0;background:none;color:#137650;font-weight:bold;padding:15px 0}.app{display:flex;min-height:100vh}aside{width:230px;position:fixed;inset:0 auto 0 0;padding:30px 18px;background:#181916;color:#fff}aside .brand{font-size:20px}nav{display:grid;gap:7px;margin-top:32px}nav button{border:0;background:transparent;color:#aaa;padding:12px;text-align:left;border-radius:7px}nav button.active{background:#30312e;color:#fff}.side{position:absolute;bottom:20px;padding:10px;color:#b8beb7;font-size:11px;line-height:1.5}main{margin-left:230px;width:calc(100% - 230px);padding:0 7% 50px}header{height:100px;display:flex;justify-content:space-between;align-items:center}header small{color:var(--muted);letter-spacing:1px}header h2{margin:5px 0}.avatar{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#dcebe2;color:#176045;font-weight:bold;font-size:11px}.view{display:none}.view.active{display:block}.balance{padding:34px;background:var(--yellow);border-radius:18px;position:relative;overflow:hidden}.balance:after{content:'';position:absolute;width:300px;height:300px;border:1px solid #fff8;border-radius:50%;right:-50px;top:-110px}.balance h1{font-size:42px;margin:8px 0}.balance button{position:absolute;right:28px;top:30px;background:#171817;color:#fff;border:0;border-radius:7px;padding:12px;z-index:1}.head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.action,.box,.list{background:var(--card);border:1px solid var(--line);border-radius:12px}.action{padding:19px;min-height:130px;text-align:left}.action b{display:block;margin-top:18px}.action small{color:var(--muted);display:block;margin-top:5px}.action.dark{background:#1b1c1a;color:#fff}.list{overflow:hidden}.tx{display:flex;gap:13px;align-items:center;width:100%;background:#fff;border:0;border-bottom:1px solid var(--line);padding:16px;text-align:left}.tx:hover{background:#fafaf7}.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e8f5ed;color:var(--good)}.ico.send{background:#fff0ed;color:var(--bad)}.tm{flex:1}.tm b{display:block}.tm span,.ta small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.ta{text-align:right;font-weight:bold}.box{padding:23px}.profile{display:flex;gap:14px;align-items:center}.verified{color:var(--good);font-weight:bold}.modalbg{display:none;position:fixed;inset:0;background:#0008;z-index:5}.modalbg.show,.modal.show{display:block}.modal{display:none;position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(490px,92vw);background:#fff;border-radius:15px;padding:28px}.close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:26px}.receipt{background:#f5f6f1;padding:13px;border-radius:8px;margin:14px 0}.receipt div{display:flex;justify-content:space-between;padding:7px;font-size:13px}.receipt span{color:var(--muted)}@media(max-width:700px){.auth{grid-template-columns:1fr}.authright,aside{display:none}main{margin:0;width:100%;padding:0 16px}.grid{grid-template-columns:1fr}.balance button{display:none}}
</style></head><body><section id="auth" class="auth"><div class="authleft"><div id="authbox" class="authbox"></div></div><div class="authright"><h1>Move money<br><span style="color:white">with clarity.</span></h1></div></section><div id="app" class="app hidden"><aside><div class="brand"><i>F</i>flow<span style="color:#ffc928">send</span></div><nav><button class="active" data-v="home">▦ &nbsp; Dashboard</button><button data-v="activity">◷ &nbsp; Activity</button><button data-v="cards">▣ &nbsp; Payment methods</button><button data-v="profile">⚙ &nbsp; Profile</button></nav><div class="side">Practice wallet environment.<br>No real payments are processed.</div></aside><main><header><div><small>GOOD MORNING</small><h2 id="welcome">Welcome back</h2></div><div class="avatar" id="avatar"></div></header><section id="home" class="view active"></section><section id="activity" class="view"></section><section id="cards" class="view"></section><section id="profile" class="view"></section></main></div><div id="back" class="modalbg"></div><div id="modal" class="modal"><button class="close" onclick="closeM()">×</button><div id="mb"></div></div><script>
const $=x=>document.getElementById(x),rates={Kenya:['KES',129.35],Nigeria:['NGN',1540],Ghana:['GHS',15.6],Tanzania:['TZS',2555],Uganda:['UGX',3715],India:['INR',83.2],Canada:['CAD',1.36]},usd=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(x);let token=localStorage.getItem('flowsend_token'),user;
async function api(url,method='GET',body){let r=await fetch(url,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):null}),d=await r.json();if(!r.ok)throw Error(d.message);return d}function modal(x){$('mb').innerHTML=x;$('modal').classList.add('show');$('back').classList.add('show')}function closeM(){$('modal').classList.remove('show');$('back').classList.remove('show')}function time(x){return new Date(x).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function auth(){let sign=false;function draw(){$('authbox').innerHTML=`<div class="brand"><i>F</i>flow<span style="color:#b98700">send</span></div><h1>${sign?'Create account':'Welcome back.'}</h1><p class="muted">${sign?'Set up your wallet profile.':'Sign in to your wallet.'}</p><form id="form">${sign?'<div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Country</label><select name="country"><option>Kenya</option><option>Nigeria</option><option>Ghana</option><option>Tanzania</option><option>Uganda</option><option>India</option><option>Canada</option></select></div>':''}<div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><button class="primary">${sign?'Create account':'Sign in'}</button></form><button id="sw" class="link">${sign?'Already have an account? Sign in':'Create an account'}</button>`;$('sw').onclick=()=>{sign=!sign;draw()};$('form').onsubmit=async e=>{e.preventDefault();try{let r=await api(sign?'/api/register':'/api/login','POST',Object.fromEntries(new FormData(e.target)));token=r.token;localStorage.setItem('flowsend_token',token);user=r.user;boot()}catch(e){alert(e.message)}}}draw()}function boot(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');render()}
function row(t){return `<button class="tx" onclick="details('${t.id}')"><div class="ico ${t.type==='send'?'send':''}">${t.type==='send'?'↗':t.type==='topup'?'+':'↓'}</div><div class="tm"><b>${t.name}</b><span>${t.detail}</span></div><div class="ta">${t.amount>0?'+':''}${usd(t.amount)}<small>${time(t.createdAt)}</small></div></button>`}
function render(){$('welcome').textContent='Welcome back, '+user.name.split(' ')[0];$('avatar').textContent=user.name.split(' ').map(x=>x[0]).join('').slice(0,2);$('home').innerHTML=`<div class="balance"><small>AVAILABLE BALANCE</small><h1>${usd(user.balance)}</h1><small>USD Wallet</small><button onclick="topup()">+ Add money</button></div><div class="head"><h3>Quick actions</h3></div><div class="grid"><button class="action dark" onclick="send()">↗<b>Send money</b><small>To anyone, anywhere</small></button><button class="action" onclick="topup()">+<b>Top up account</b><small>Add USD to your wallet</small></button><button class="action" onclick="withdraw()">↓<b>Withdraw</b><small>Move money to a card</small></button></div><div class="head"><h3>Transaction history</h3><button onclick="nav('activity')">View all →</button></div><div class="list">${user.history.slice(0,5).map(row).join('')||'<div class="box">No transactions yet.</div>'}</div>`;$('activity').innerHTML=`<div class="head"><h2>Activity</h2><input id="search" placeholder="Search history"></div><div class="list" id="list">${user.history.map(row).join('')||'<div class="box">No transactions yet.</div>'}</div>`;$('search').oninput=e=>$('list').innerHTML=user.history.filter(t=>(t.name+t.detail+t.id).toLowerCase().includes(e.target.value.toLowerCase())).map(row).join('');let c=user.card;$('cards').innerHTML=`<div class="head"><h2>Payment methods</h2></div><div class="box">${c?`<h3>${c.brand} •••• ${c.last4}</h3><p class="muted">${c.name} · Expires ${c.expiry}</p><button onclick="card()">Edit linked card</button>`:`<h3>No card linked</h3><p class="muted">Add a card alias for top-ups and withdrawals.</p><button onclick="card()">Link card</button>`}</div>`;$('profile').innerHTML=`<div class="head"><h2>Profile</h2></div><div class="box"><div class="profile"><div class="avatar">${$('avatar').textContent}</div><div><b>${user.name}</b><br><span class="verified">● Verified profile</span></div></div><p>${user.email}</p><p>Country: ${user.country}</p><button onclick="profile()">Edit profile</button></div>`}
function nav(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v))}function save(r){user=r.user;render()}async function makeTx(data){try{let r=await api('/api/transaction','POST',data);save(r);details(r.transaction.id)}catch(e){alert(e.message)}}
function card(){modal(`<h2>Link card</h2><p class="muted">Only the card type, last four digits, and expiry are saved.</p><form id="f"><div class="field"><label>Name on card</label><input name="name" value="${user.card?.name||user.name}" required></div><div class="field"><label>Card type</label><select name="brand"><option>Visa</option><option>Mastercard</option></select></div><div class="field"><label>Last four digits</label><input name="last4" pattern="\d{4}" maxlength="4" required></div><div class="field"><label>Expiry</label><input name="expiry" placeholder="12/29" required></div><button class="primary">Save linked card</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();try{save(await api('/api/card','POST',Object.fromEntries(new FormData(e.target))));closeM()}catch(e){alert(e.message)}}}
function topup(){modal(`<h2>Top up account</h2><form id="f"><div class="field"><label>Amount in USD</label><input name="amount" type="number" min="1" required></div><button class="primary">Add money</button></form>`);$('f').onsubmit=e=>{e.preventDefault();makeTx({type:'topup',amount:+new FormData(e.target).get('amount')})}}
function withdraw(){if(!user.card)return card();modal(`<h2>Withdraw to card</h2><form id="f"><div class="field"><label>Amount in USD</label><input name="amount" type="number" min="1" required></div><button class="primary">Withdraw funds</button></form>`);$('f').onsubmit=e=>{e.preventDefault();makeTx({type:'withdraw',amount:+new FormData(e.target).get('amount')})}}
function send(){let opts=Object.keys(rates).map(x=>`<option>${x}</option>`).join('');modal(`<h2>Send money</h2><form id="f"><div class="field"><label>Receiver name</label><input name="name" required></div><div class="field"><label>Country</label><select id="country" name="country">${opts}</select></div><div class="field"><label>Amount in USD</label><input id="amount" name="amount" type="number" min="1" required></div><div class="receipt" id="conversion">Enter an amount to see the local-currency value.</div><button class="primary">Send money</button></form>`);$('f').oninput=()=>{let a=+$('amount').value||0,[c,r]=rates[$('country').value];$('conversion').textContent=`Receiver gets ${new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(a*r)}`};$('f').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),a=+d.get('amount'),[c,r]=rates[d.get('country')];makeTx({type:'send',amount:a,name:d.get('name'),country:d.get('country'),received:new Intl.NumberFormat('en-US',{style:'currency',currency:c}).format(a*r)})}}
function details(id){let t=user.history.find(x=>x.id===id);modal(`<h2>Transaction successful</h2><div class="receipt"><div><span>Transaction ID</span><b>${t.id}</b></div><div><span>Status</span><b>${t.status}</b></div><div><span>Name</span><b>${t.name}</b></div><div><span>Amount</span><b>${usd(Math.abs(t.amount))}</b></div><div><span>Time</span><b>${time(t.createdAt)}</b></div>${t.received?`<div><span>Receiver gets</span><b>${t.received}</b></div>`:''}</div><button class="primary" onclick="closeM()">Done</button>`)}function profile(){modal(`<h2>Edit profile</h2><form id="f"><div class="field"><label>Full name</label><input name="name" value="${user.name}" required></div><div class="field"><label>Country</label><select name="country">${Object.keys(rates).map(x=>`<option ${x===user.country?'selected':''}>${x}</option>`)}</select></div><button class="primary">Save profile</button></form>`);$('f').onsubmit=async e=>{e.preventDefault();try{save(await api('/api/profile','POST',Object.fromEntries(new FormData(e.target))));closeM()}catch(e){alert(e.message)}}}
document.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>nav(x.dataset.v));$('back').onclick=closeM;token?api('/api/me').then(x=>{user=x;boot()}).catch(()=>{localStorage.removeItem('flowsend_token');auth()}):auth();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
