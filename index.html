<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowSend Testnet</title><style>
:root{--bg:#f5f7f4;--card:#fff;--ink:#162018;--muted:#6d756d;--line:#e0e6df;--accent:#ffc928;--good:#198754;--bad:#cf513f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial}body.dark{--bg:#151916;--card:#202620;--ink:#f5f6ef;--muted:#aeb8ae;--line:#363e36}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center}.authbox{width:min(420px,92vw);background:var(--card);padding:32px;border-radius:16px;border:1px solid var(--line)}.brand{font-size:22px;font-weight:bold}.badge{display:inline-block;background:#fff0af;color:#5a4700;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:bold;margin:14px 0}.field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}.primary{background:var(--accent);border:0;padding:12px;border-radius:7px;font-weight:bold;width:100%;margin-top:18px}.link{background:none;border:0;color:#147550;padding-top:14px;font-weight:bold}.layout{display:flex;min-height:100vh}aside{position:fixed;width:235px;inset:0 auto 0 0;background:#172018;color:#fff;padding:26px 16px}nav{display:grid;gap:5px;margin-top:28px}nav button{background:transparent;border:0;color:#aab4aa;text-align:left;padding:12px;border-radius:7px}nav button.active{background:#2e382e;color:#fff}.notice{position:absolute;bottom:20px;font-size:11px;color:#cbd2cb;padding:8px}main{margin-left:235px;width:calc(100% - 235px);padding:0 6% 50px}header{height:86px;display:flex;justify-content:space-between;align-items:center}.avatar{width:38px;height:38px;display:grid;place-items:center;background:#daeadc;color:#175a33;border-radius:50%;font-size:11px;font-weight:bold}.view{display:none}.view.active{display:block}.hero{background:linear-gradient(115deg,#ffcc2c,#ffe181);padding:28px;border-radius:16px;position:relative}.hero h1{margin:7px 0;font-size:38px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.card h3{margin:0 0 9px}.head{display:flex;justify-content:space-between;align-items:center;margin:27px 0 12px}.asset{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.table{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;padding:13px;border-bottom:1px solid var(--line)}.green{color:var(--good)}.red{color:var(--bad)}.chart{height:210px;background:repeating-linear-gradient(0deg,transparent,transparent 34px,var(--line) 35px),linear-gradient(135deg,transparent 42%,#ffd343 42%,#ffd343 44%,transparent 44%);border-radius:10px}.book{display:grid;grid-template-columns:1fr 1fr;gap:2px;font-family:monospace;font-size:12px}.ask{color:var(--bad)}.bid{color:var(--good)}.modalbg{display:none;position:fixed;inset:0;background:#0008;z-index:4}.modalbg.show,.modal.show{display:block}.modal{display:none;position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,92vw);background:var(--card);padding:28px;border-radius:14px}.close{position:absolute;right:12px;top:8px;border:0;background:none;color:var(--ink);font-size:26px}.pill{padding:5px 8px;border-radius:99px;background:#e7f4eb;color:var(--good);font-size:11px}.tiny{font-size:12px;color:var(--muted)}@media(max-width:700px){aside{display:none}main{margin:0;width:100%;padding:0 16px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.hero h1{font-size:30px}}
</style></head><body><section id="auth" class="auth"><div class="authbox" id="authbox"></div></section><div class="layout hidden" id="app"><aside><div class="brand">◈ Testnet Lab</div><nav><button class="active" data-v="home">Overview</button><button data-v="trade">Spot trading</button><button data-v="markets">Markets & convert</button><button data-v="earn">Earn & launchpad</button><button data-v="social">Social & P2P</button><button data-v="security">Security & settings</button><button data-v="ops">Support & operations</button></nav><div class="notice">PRACTICE ONLY<br>No assets, trades, deposits, or withdrawals are real.</div></aside><main><header><div><small>TESTNET / PRACTICE ENVIRONMENT</small><h2 id="hello">Welcome</h2></div><div class="avatar" id="avatar"></div></header><section id="home" class="view active"></section><section id="trade" class="view"></section><section id="markets" class="view"></section><section id="earn" class="view"></section><section id="social" class="view"></section><section id="security" class="view"></section><section id="ops" class="view"></section></main></div><div id="back" class="modalbg"></div><div id="modal" class="modal"><button class="close" onclick="closeM()">×</button><div id="modalbody"></div></div><script>
const $=x=>document.getElementById(x),fmt=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(x),prices={'BTC/USDT':67250,'ETH/USDT':3520,'SOL/USDT':148};let token=localStorage.getItem('tn_token'),user;
async function api(u,m='GET',b){let r=await fetch(u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b?JSON.stringify(b):null}),d=await r.json();if(!r.ok)throw Error(d.message);return d}function modal(x){$('modalbody').innerHTML=x;$('modal').classList.add('show');$('back').classList.add('show')}function closeM(){$('modal').classList.remove('show');$('back').classList.remove('show')}function time(x){return new Date(x).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function auth(){let signup=false;function draw(){$('authbox').innerHTML=`<div class="brand">◈ Testnet Trading Lab</div><div class="badge">PRACTICE ONLY — NO REAL FUNDS</div><h2>${signup?'Create practice account':'Sign in'}</h2><form id="f">${signup?'<div class="field"><label>Name</label><input name="name" required></div>':''}<div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><button class="primary">${signup?'Create account':'Sign in'}</button></form><button id="switch" class="link">${signup?'Already enrolled? Sign in':'Create a practice account'}</button>`;$('switch').onclick=()=>{signup=!signup;draw()};$('f').onsubmit=async e=>{e.preventDefault();try{let r=await api(signup?'/api/register':'/api/login','POST',Object.fromEntries(new FormData(e.target)));token=r.token;localStorage.setItem('tn_token',token);user=r.user;boot()}catch(e){alert(e.message)}}}draw()}
function boot(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');render()}
function home(){let assets=Object.entries(user.assets).map(([a,v])=>`<div class="asset"><b>${a}</b><span>${v}</span></div>`).join('');return `<div class="hero"><small>SIMULATED PORTFOLIO VALUE</small><h1>${fmt(user.balance)}</h1><span class="pill">+2.40% simulated 24h</span></div><div class="head"><h3>Portfolio & analytics</h3><span class="tiny">Test data updates after practice orders</span></div><div class="grid"><div class="card"><h3>Assets</h3>${assets}</div><div class="card"><h3>Performance</h3><div class="chart"></div></div><div class="card"><h3>Feature lab</h3><p>Wallet ledger ✓</p><p>Price alerts ✓</p><p>VIP fees · tier 1</p><p>Risk simulator ✓</p></div></div><div class="head"><h3>Recent practice activity</h3></div><div class="table">${user.history.slice(0,5).map(row).join('')||'<div class="row">No practice orders yet.</div>'}</div>`}function row(x){return `<div class="row"><b>${x.market||x.type}</b><span class="${x.side==='Buy'?'green':'red'}">${x.side||x.status}</span><span>${x.amount||''} @ ${x.price||''}</span><small>${time(x.createdAt)}</small></div>`}
function trade(){return `<div class="head"><h2>Spot trading simulator</h2><button onclick="order()">Place practice order</button></div><div class="grid"><div class="card"><h3>BTC/USDT · ${fmt(prices['BTC/USDT'])}</h3><div class="chart"></div><p class="tiny">Candlestick / RSI / MACD / moving-average placeholders for practice.</p></div><div class="card"><h3>Order book</h3><div class="book"><div class="ask">Ask 67,290<br>Ask 67,275<br>Ask 67,260</div><div class="bid">Bid 67,240<br>Bid 67,225<br>Bid 67,210</div></div><hr><h3>Perpetuals training</h3><p>Practice-only long/short, 2×–20× leverage and liquidation examples.</p><button onclick="order('Futures')">Open simulator</button></div><div class="card"><h3>Risk controls</h3><p>Margin health: 100%</p><p>Liquidation engine: simulated</p><p>Audit activity: logged</p></div></div>`}
function markets(){return `<div class="head"><h2>Markets & instant convert</h2></div><div class="grid">${Object.entries(prices).map(([m,p])=>`<div class="card"><h3>${m}</h3><b>${fmt(p)}</b><p class="green">+1.8% simulated</p><button onclick="convert('${m}')">Practice convert</button></div>`).join('')}</div><div class="card" style="margin-top:15px"><h3>Multi-chain practice wallet</h3><p>BTC · Ethereum · Solana · ERC-20 assets · address whitelist and Web3 connection are represented as non-custodial training concepts only.</p></div>`}
function earn(){return `<div class="head"><h2>Earn, staking & launchpad</h2></div><div class="grid"><div class="card"><h3>Locked savings</h3><p>ETH · 3.2% APY simulated</p><button>Practice stake</button></div><div class="card"><h3>Flexible pools</h3><p>USDT · daily accrual simulator</p><button>Practice deposit</button></div><div class="card"><h3>Launchpad & AMM lab</h3><p>Allocation, liquidity and fee-share walkthroughs.</p><button>Explore test pool</button></div></div>`}
function social(){return `<div class="head"><h2>Social & ecosystem</h2></div><div class="grid"><div class="card"><h3>Copy-trading lab</h3><p>Follow simulated strategy results only.</p><button>Browse strategies</button></div><div class="card"><h3>P2P training board</h3><p>Practice escrow lifecycle; no payment methods or real orders.</p><button>View walkthrough</button></div><div class="card"><h3>Referrals & VIP</h3><p>Practice fee tiers and affiliate attribution.</p><button>View tier</button></div></div><div class="card" style="margin-top:15px"><h3>Alerts</h3><input id="alert" placeholder="e.g. BTC above 70000"><button onclick="alertAdd()">Save test alert</button><p>${user.alerts.join('<br>')}</p></div>`}
function security(){return `<div class="head"><h2>Security & sessions</h2></div><div class="grid"><div class="card"><h3>2FA & passkeys</h3><p>Training configuration screen only.</p><button>Configure</button></div><div class="card"><h3>Withdrawal protection</h3><p>Address whitelist and anti-phishing phrase simulated.</p><button>Manage</button></div><div class="card"><h3>Appearance</h3><button onclick="toggleDark()">Toggle dark mode</button></div></div><div class="card" style="margin-top:15px"><h3>Login activity</h3>${user.sessions.map(x=>`<p>${x.label} · ${time(x.createdAt)}</p>`).join('')}</div>`}
function ops(){return `<div class="head"><h2>Support & operations</h2></div><div class="grid"><div class="card"><h3>Support centre</h3><p>Test ticket and AI-assistant workflow.</p><button>Open test ticket</button></div><div class="card"><h3>Announcements</h3>${user.notices.slice(0,4).map(n=>`<p>${n}</p>`).join('')}</div><div class="card"><h3>Compliance lab</h3><p>Audit logs and AML rules are simulated educational examples—not compliance tooling.</p></div></div>`}
function render(){document.body.classList.toggle('dark',user.dark);$('hello').textContent='Welcome, '+user.name.split(' ')[0];$('avatar').textContent=user.name.split(' ').map(x=>x[0]).join('').slice(0,2);$('home').innerHTML=home();$('trade').innerHTML=trade();$('markets').innerHTML=markets();$('earn').innerHTML=earn();$('social').innerHTML=social();$('security').innerHTML=security();$('ops').innerHTML=ops()}
function order(type='Spot'){modal(`<h2>Practice ${type} order</h2><form id="of"><div class="field"><label>Market</label><select name="market">${Object.keys(prices).map(x=>`<option>${x}</option>`)}</select></div><div class="field"><label>Side</label><select name="side"><option>Buy</option><option>Sell</option></select></div><div class="field"><label>Amount</label><input name="amount" type="number" step=".0001" required></div><div class="field"><label>Price</label><input name="price" type="number" value="67250" required></div><button class="primary">Place test order</button></form>`);$('of').onsubmit=async e=>{e.preventDefault();try{let r=await api('/api/order','POST',{...Object.fromEntries(new FormData(e.target)),type});user=r.user;closeM();render()}catch(e){alert(e.message)}}}
function convert(m){order('Instant Convert')}async function alertAdd(){let v=$('alert').value.trim();if(!v)return;user=await api('/api/preferences','POST',{alerts:[...user.alerts,v]});render()}async function toggleDark(){user=await api('/api/preferences','POST',{dark:!user.dark});render()}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===b.dataset.v));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b))});$('back').onclick=closeM;token?api('/api/me').then(x=>{user=x;boot()}).catch(()=>{localStorage.removeItem('tn_token');auth()}):auth();
</script></body></html>
